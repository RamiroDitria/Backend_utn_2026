server:
  port: 8083

spring:
  application:
    name: ms-ordenes
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ordenes}
    username: ${DB_USER:taller}
    password: ${DB_PASSWORD:taller}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: true
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${KEYCLOAK_JWKS_URI:http://localhost:8081/realms/taller/protocol/openid-connect/certs}

servicios:
  vehiculos-url: ${VEHICULOS_URL:http://localhost:8082}
  notificaciones-url: ${NOTIFICACIONES_URL:http://localhost:8084}
  timeout-ms: 3000

presupuesto:
  dias-vigencia: 7
